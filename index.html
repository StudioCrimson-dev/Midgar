<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Midgar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ───── LIBRARY VIEW ───── -->
  <div id="view-library" class="view active">
    <header class="library-header">
      <div class="header-inner">
        <div class="logo">
          <span class="logo-icon">✦</span>
          <h1>Midgar</h1>
        </div>
        <div class="header-actions">
          <button class="btn-primary" id="btn-new-book">+ New Book</button>
        </div>
      </div>
    </header>

    <main class="library-grid" id="library-grid">
      <!-- Book cards injected by JS -->
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">📚</div>
        <p>Your library is empty.<br>Create your first book to begin.</p>
      </div>
    </main>
  </div>

  <!-- ───── BOOK VIEW ───── -->
  <div id="view-book" class="view">
    <header class="book-header">
      <button class="btn-back" id="btn-back-library">← Library</button>
      <div class="book-header-info">
        <h2 id="book-title-display"></h2>
        <span id="book-chapter-count" class="chapter-count-badge"></span>
        <span id="book-info-count" class="chapter-count-badge info-badge"></span>
      </div>
      <div class="book-header-actions">
        <button class="btn-secondary" id="btn-edit-book-meta">Edit Details</button>
        <button class="btn-secondary" id="btn-import-md" title="Import Markdown files as chapters">Import .md</button>
        <button class="btn-primary" id="btn-new-chapter">+ Chapter</button>
        <!-- Markdown files, plus any images they reference (matched by file name) -->
        <input type="file" id="input-import-md" class="hidden-file" multiple
               accept=".md,.markdown,.mdown,.txt,text/markdown,text/plain,image/*" />
      </div>
    </header>

    <div class="book-layout">
      <!-- Sidebar: chapter list -->
      <aside class="chapter-sidebar">
        <h3 class="sidebar-title">Chapters</h3>
        <ul class="chapter-list" id="chapter-list"></ul>
      </aside>

      <!-- Chapter reader/editor area -->
      <section class="chapter-area" id="chapter-area">
        <div class="chapter-welcome" id="chapter-welcome">
          <p>Select a chapter to read,<br>or create a new one.</p>
        </div>
      </section>
    </div>
  </div>

  <!-- ───── CHAPTER EDITOR VIEW ───── -->
  <div id="view-editor" class="view">
    <header class="editor-header">
      <button class="btn-back" id="btn-back-book">← Back</button>
      <input type="text" id="editor-chapter-title" class="editor-title-input" placeholder="Chapter Title…" aria-label="Chapter title" />
      <label class="info-checkbox-label">
        <input type="checkbox" id="editor-is-info" />
        <span>This is an information chapter</span>
      </label>
      <div class="editor-actions">
        <button class="btn-secondary" id="btn-add-image" type="button" title="Insert pictures (you can also paste or drop them into the text)">+ Image</button>
        <input type="file" id="input-chapter-image" class="hidden-file" accept="image/*" multiple />
        <button class="btn-secondary toggle-preview" id="btn-toggle-preview">Preview</button>
        <button class="btn-primary" id="btn-save-chapter">Save</button>
      </div>
    </header>
    <div class="editor-body">
      <textarea id="editor-textarea" aria-label="Chapter text" placeholder="Begin writing… Markdown is supported.&#10;&#10;# Heading&#10;**bold**, *italic*, > blockquote&#10;&#10;Paste or drop a picture here to add it."></textarea>
      <div id="editor-preview" class="editor-preview hidden"></div>
    </div>
  </div>

  <!-- ───── MODAL: New / Edit Book ───── -->
  <div id="modal-book" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-book-title">
    <div class="modal">
      <h2 class="modal-title" id="modal-book-title">New Book</h2>
      <div class="modal-body">
        <label>Title
          <input type="text" id="input-book-title" placeholder="Enter book title…" maxlength="200" />
        </label>
        <label>Description
          <textarea id="input-book-description" rows="4" maxlength="1000" placeholder="What is this book about? (optional)"></textarea>
        </label>
        <div class="field">
          <span class="field-label">Cover Art</span>
          <div class="cover-upload-area" id="cover-upload-area" role="button" tabindex="0" aria-label="Choose cover image">
            <img id="cover-preview" class="cover-preview hidden" alt="Cover preview" />
            <div class="cover-placeholder" id="cover-placeholder">
              <span>Click to upload image</span>
              <small>PNG, JPG, WEBP</small>
            </div>
          </div>
          <input type="file" id="input-cover" accept="image/*" class="hidden-file" />
          <button type="button" class="btn-ghost btn-remove-cover hidden" id="btn-remove-cover">Remove cover</button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" id="btn-modal-cancel">Cancel</button>
        <button class="btn-primary" id="btn-modal-save">Save Book</button>
      </div>
    </div>
  </div>

  <!-- ───── MODAL: Confirm ───── -->
  <div id="modal-confirm" class="modal-overlay hidden" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <div class="modal modal-sm">
      <h2 class="modal-title" id="confirm-title">Delete?</h2>
      <p class="modal-body" id="confirm-message">This action cannot be undone.</p>
      <div class="modal-footer">
        <button class="btn-ghost" id="btn-confirm-cancel">Cancel</button>
        <button class="btn-danger" id="btn-confirm-ok">Delete</button>
      </div>
    </div>
  </div>

  <!-- ───── TOAST ───── -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
