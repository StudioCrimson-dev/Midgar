<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ───── LIBRARY VIEW ───── -->
  <div id="view-library" class="view active">
    <header class="library-header">
      <div class="header-inner">
        <div class="logo">
          <span class="logo-icon">✦</span>
          <h1>My Library</h1>
        </div>
        <button class="btn-primary" id="btn-new-book">+ New Book</button>
      </div>
    </header>

    <main class="library-grid" id="library-grid">
      <!-- Book cards injected by JS -->
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">📚</div>
        <p>Your library is empty.<br>Create your first book to begin.</p>
      </div>
    </main>
  </div>

  <!-- ───── BOOK VIEW ───── -->
  <div id="view-book" class="view">
    <header class="book-header">
      <button class="btn-back" id="btn-back-library">← Library</button>
      <div class="book-header-info">
        <h2 id="book-title-display"></h2>
        <span id="book-chapter-count" class="chapter-count-badge"></span>
        <span id="book-info-count" class="chapter-count-badge info-badge"></span>
      </div>
      <div class="book-header-actions">
        <button class="btn-secondary" id="btn-edit-book-meta">Edit Details</button>
        <button class="btn-primary" id="btn-new-chapter">+ Chapter</button>
      </div>
    </header>

    <div class="book-layout">
      <!-- Sidebar: chapter list -->
      <aside class="chapter-sidebar">
        <h3 class="sidebar-title">Chapters</h3>
        <ul class="chapter-list" id="chapter-list"></ul>
      </aside>

      <!-- Chapter reader/editor area -->
      <section class="chapter-area" id="chapter-area">
        <div class="chapter-welcome" id="chapter-welcome">
          <p>Select a chapter to read,<br>or create a new one.</p>
        </div>
      </section>
    </div>
  </div>

  <!-- ───── CHAPTER EDITOR VIEW ───── -->
  <div id="view-editor" class="view">
    <header class="editor-header">
      <button class="btn-back" id="btn-back-book">← Back</button>
      <input type="text" id="editor-chapter-title" class="editor-title-input" placeholder="Chapter Title…" />
      <label class="info-checkbox-label">
        <input type="checkbox" id="editor-is-info" />
        <span>This is an information chapter</span>
      </label>
      <div class="editor-actions">
        <button class="btn-secondary toggle-preview" id="btn-toggle-preview">Preview</button>
        <button class="btn-primary" id="btn-save-chapter">Save</button>
      </div>
    </header>
    <div class="editor-body">
      <textarea id="editor-textarea" placeholder="Begin writing… Markdown is supported.&#10;&#10;# Heading&#10;**bold**, *italic*, > blockquote"></textarea>
      <div id="editor-preview" class="editor-preview hidden"></div>
    </div>
  </div>

  <!-- ───── MODAL: New / Edit Book ───── -->
  <div id="modal-book" class="modal-overlay hidden">
    <div class="modal">
      <h2 class="modal-title" id="modal-book-title">New Book</h2>
      <div class="modal-body">
        <label>Title
          <input type="text" id="input-book-title" placeholder="Enter book title…" />
        </label>
        <label>Cover Art
          <div class="cover-upload-area" id="cover-upload-area">
            <img id="cover-preview" class="cover-preview hidden" alt="Cover preview" />
            <div class="cover-placeholder" id="cover-placeholder">
              <span>Click to upload image</span>
              <small>PNG, JPG, WEBP</small>
            </div>
            <input type="file" id="input-cover" accept="image/*" class="hidden-file" />
          </div>
        </label>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" id="btn-modal-cancel">Cancel</button>
        <button class="btn-primary" id="btn-modal-save">Save Book</button>
      </div>
    </div>
  </div>

  <!-- ───── MODAL: Confirm Delete ───── -->
  <div id="modal-confirm" class="modal-overlay hidden">
    <div class="modal modal-sm">
      <h2 class="modal-title">Delete?</h2>
      <p class="modal-body" id="confirm-message">This action cannot be undone.</p>
      <div class="modal-footer">
        <button class="btn-ghost" id="btn-confirm-cancel">Cancel</button>
        <button class="btn-danger" id="btn-confirm-ok">Delete</button>
      </div>
    </div>
  </div>

  <!-- ───── TOAST ───── -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
